<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - {{ app_name }}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ static_versioned_url(static_url('favicon.ico')) }}">
    
    <!-- CSS de base -->
    <link rel="stylesheet" href="{{ static_versioned_url(static_url('css/base.css')) }}">
    <link rel="stylesheet" href="{{ static_versioned_url(static_url('css/theme.css')) }}">
    <link rel="stylesheet" href="{{ static_versioned_url(static_url('css/components.css')) }}">
    <link rel="stylesheet" href="{{ static_versioned_url(static_url('css/responsive.css')) }}">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================
           STYLES SPÉCIFIQUES À LA PAGE DE LANDING
           ======================================== */

        /* Reset pour la page de landing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--white-color);
            overflow-x: hidden;
            position: relative;
        }

        /* Arrière-plan avec carrousel d'images */
        .background-carousel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .background-carousel .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .background-carousel .bg-image.active {
            opacity: 1;
        }

        /* Overlay pour améliorer la lisibilité */
        .background-carousel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* Layout principal */
        .login-container {
            min-height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            box-sizing: border-box;
            margin: 0;
            position: relative;
            z-index: 10;
        }

        .landing-wrapper {
            max-width: 600px;
            width: 100%;
            text-align: center;
            padding: 1rem 0;
        }

        /* Logo et titre */
        .landing-header {
            margin-bottom: 48px;
        }

        .logo-container {
            margin: 0 auto 24px;
            width: 120px;
            height: 120px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            padding: 12px;
        }

        .logo-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            border: 4px solid var(--secondary-color);
            box-shadow: 0 8px 16px rgba(255, 255, 255, 0.3);
            background-color: #ffffff;
        }

        .landing-title {
            font-family: 'Poppins', sans-serif;
            font-size: 42px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 255, 255, 0.3);
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .landing-subtitle {
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            font-weight: 300;
            font-style: italic;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.1);
            letter-spacing: 1px;
            line-height: 1.6;
        }

        /* Conteneur des boutons */
        .menu-buttons-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 48px;
        }

        .menu-button {
            width: 100%;
            padding: 24px 32px;
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-color);
            background: #ffc425;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .menu-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .menu-button:hover::before {
            left: 100%;
        }

        .menu-button:hover {
            background: var(--white-color);
            color: var(--text-color);
            border-color: rgba(255, 255, 255, 0.8);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .menu-button:active {
            transform: translateY(-2px);
        }

        .menu-button-icon {
            font-size: 28px;
            display: inline-block;
        }

        /* Horloge style écran de veille Microsoft */
        .clock-container {
            position: fixed;
            top: 40px;
            left: 40px;
            z-index: 100;
            color: white;
            font-family: 'Segoe UI Light', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 2px 10px rgba(0, 0, 0, 0.5);
            -webkit-user-select: none;
            user-select: none;
            pointer-events: none;
        }

        .clock-time {
            font-size: 120px;
            font-weight: 100;
            line-height: 1;
            letter-spacing: -2px;
            margin: 0;
            padding: 0;
        }

        .clock-date {
            font-size: 28px;
            font-weight: 300;
            line-height: 1.2;
            margin-top: 8px;
            opacity: 0.9;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .clock-time {
                font-size: 80px;
            }

            .clock-date {
                font-size: 20px;
                margin-top: 8px;
            }

            .landing-title {
                font-size: 38px;
            }

            .landing-subtitle {
                font-size: 18px;
            }

            .menu-button {
                padding: 22px 28px;
                font-size: 19px;
            }

            .logo-container {
                width: 110px;
                height: 110px;
            }
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 15px;
            }

            .landing-wrapper {
                padding: 0.5rem 0;
            }

            .clock-container {
                top: 15px;
                right: 15px;
                left: auto;
                text-align: right;
            }

            .clock-time {
                font-size: 60px;
            }

            .clock-date {
                font-size: 15px;
                margin-top: 6px;
                text-align: right;
            }

            .landing-header {
                margin-bottom: 36px;
            }

            .landing-title {
                font-size: 32px;
                margin-bottom: 12px;
            }

            .landing-subtitle {
                font-size: 16px;
                line-height: 1.5;
            }

            .logo-container {
                width: 100px;
                height: 100px;
                margin-bottom: 20px;
            }

            .menu-buttons-container {
                margin-top: 36px;
                gap: 16px;
            }

            .menu-button {
                padding: 20px 24px;
                font-size: 18px;
                min-height: 56px; /* Taille minimale pour le touch */
            }

            .menu-button-icon {
                font-size: 24px;
            }
        }

        @media (max-width: 640px) {
            .login-container {
                padding: 12px;
            }

            .clock-container {
                top: 10px;
                right: 10px;
                left: auto;
                text-align: right;
            }

            .clock-time {
                font-size: 50px;
            }

            .clock-date {
                font-size: 13px;
                margin-top: 5px;
                text-align: right;
            }

            .landing-header {
                margin-bottom: 32px;
            }

            .landing-title {
                font-size: 28px;
                margin-bottom: 10px;
            }

            .landing-subtitle {
                font-size: 14px;
                line-height: 1.4;
                padding: 0 10px;
            }

            .logo-container {
                width: 90px;
                height: 90px;
                margin-bottom: 16px;
                padding: 10px;
            }

            .menu-buttons-container {
                margin-top: 32px;
                gap: 14px;
            }

            .menu-button {
                padding: 18px 20px;
                font-size: 16px;
                min-height: 52px;
                border-radius: 12px;
            }

            .menu-button-icon {
                font-size: 22px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 10px;
            }

            .clock-container {
                top: 8px;
                right: 8px;
                left: auto;
                text-align: right;
            }

            .clock-time {
                font-size: 42px;
            }

            .clock-date {
                font-size: 11px;
                margin-top: 3px;
                line-height: 1.1;
                text-align: right;
            }

            .landing-header {
                margin-bottom: 24px;
            }

            .landing-title {
                font-size: 24px;
                margin-bottom: 8px;
            }

            .landing-subtitle {
                font-size: 13px;
                line-height: 1.3;
                padding: 0 5px;
            }

            .logo-container {
                width: 80px;
                height: 80px;
                margin-bottom: 12px;
                padding: 8px;
            }

            .menu-buttons-container {
                margin-top: 24px;
                gap: 12px;
            }

            .menu-button {
                padding: 16px 18px;
                font-size: 15px;
                min-height: 48px;
                border-radius: 10px;
                border-width: 2px;
            }

            .menu-button-icon {
                font-size: 20px;
            }
        }

        @media (max-height: 600px) {
            .clock-container {
                top: 8px;
                right: 8px;
                left: auto;
                text-align: right;
            }

            .clock-time {
                font-size: 40px;
            }

            .clock-date {
                font-size: 11px;
                margin-top: 3px;
                line-height: 1.1;
                text-align: right;
            }

            .landing-header {
                margin-bottom: 24px;
            }

            .logo-container {
                width: 80px;
                height: 80px;
                margin-bottom: 12px;
            }

            .landing-title {
                font-size: 24px;
                margin-bottom: 8px;
            }

            .landing-subtitle {
                font-size: 13px;
                margin-bottom: 0;
            }

            .menu-buttons-container {
                margin-top: 24px;
                gap: 12px;
            }

            .menu-button {
                padding: 14px 18px;
                font-size: 15px;
                min-height: 44px;
            }
        }

        @media (max-width: 360px) {
            .clock-container {
                top: 5px;
                right: 5px;
            }

            .clock-time {
                font-size: 36px;
            }

            .clock-date {
                font-size: 10px;
                margin-top: 2px;
                line-height: 1.1;
                text-align: right;
            }

            .landing-title {
                font-size: 22px;
            }

            .landing-subtitle {
                font-size: 12px;
            }

            .menu-button {
                padding: 14px 16px;
                font-size: 14px;
            }

            .menu-button-icon {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- Carrousel d'images en arrière-plan -->
    <div class="background-carousel" id="backgroundCarousel">
        <div class="bg-image active" style="background-image: url('{{ static_versioned_url(static_url('images/backgroundlogin/BGlogin.jpg')) }}');" data-index="0"></div>
        <div class="bg-image" style="background-image: url('{{ static_versioned_url(static_url('images/backgroundlogin/christian-joudrey-u_nsiSvPEak-unsplash.jpg')) }}');" data-index="1"></div>
        <div class="bg-image" style="background-image: url('{{ static_versioned_url(static_url('images/backgroundlogin/jonatan-pie-3l3RwQdHRHg-unsplash.jpg')) }}');" data-index="2"></div>
        <div class="bg-image" style="background-image: url('{{ static_versioned_url(static_url('images/backgroundlogin/alexander-slattery-LI748t0BK8w-unsplash.jpg')) }}');" data-index="3"></div>
    </div>

    <!-- Horloge style écran de veille Microsoft -->
    <div class="clock-container" id="clockContainer">
        <div class="clock-time" id="clockTime">00:00</div>
        <div class="clock-date" id="clockDate">lundi 1 janvier 2024</div>
    </div>

    <div class="login-container">
        <div class="landing-wrapper">
            <!-- Logo et Titre -->
            <div class="landing-header">
                <div class="logo-container">
                    <img src="{{ static_versioned_url(get_logo_url()) }}" alt="Logo {{ app_name }}" class="logo-image" onerror="this.src='{{ static_versioned_url(static_url('images/logo.webp')) }}'">
                </div>
                <h1 class="landing-title">
                    {{ app_name }}
                </h1>
                <p class="landing-subtitle">
                    Ministère du patrimoine, du Portefeuille de l'Etat et des Entreprises Publiques
                </p>
            </div>

            <!-- Menu des boutons -->
            <div class="menu-buttons-container">
                <a href="{{ url_for('login_page') }}?type=ministre" class="menu-button">
                    <span class="menu-button-icon">🏛️</span>
                    <span>MINISTRE</span>
                </a>
                <a href="{{ url_for('login_page') }}?type=rprog" class="menu-button">
                    <span class="menu-button-icon">🤝</span>
                    <span>RPROG</span>
                </a>
                <a href="{{ url_for('login_page') }}?type=rffim" class="menu-button">
                    <span class="menu-button-icon">👤</span>
                    <span>RFFIM</span>
                </a>
                <a href="{{ url_for('login_page') }}?type=rbop" class="menu-button">
                    <span class="menu-button-icon">👤</span>
                    <span>RBOP</span>
                </a>
                <a href="{{ url_for('login_page') }}?type=ruo" class="menu-button">
                    <span class="menu-button-icon">👤</span>
                    <span>RUO</span>
                </a>
                <a href="{{ url_for('login_page') }}?type=agent" class="menu-button">
                    <span class="menu-button-icon">👤</span>
                    <span>Agent</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // HORLOGE STYLE ÉCRAN DE VEILLE MICROSOFT
        // ========================================
        (function() {
            const clockTime = document.getElementById('clockTime');
            const clockDate = document.getElementById('clockDate');

            // Noms des jours et mois en français
            const jours = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
            const mois = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 
                         'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

            function updateClock() {
                const now = new Date();
                
                // Formater l'heure (HH:MM)
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                clockTime.textContent = `${hours}:${minutes}`;
                
                // Formater la date
                const jourSemaine = jours[now.getDay()];
                const jour = now.getDate();
                const moisNom = mois[now.getMonth()];
                const annee = now.getFullYear();
                clockDate.textContent = `${jourSemaine} ${jour} ${moisNom} ${annee}`;
            }

            // Mettre à jour immédiatement
            updateClock();
            
            // Mettre à jour toutes les minutes (60000 ms)
            setInterval(updateClock, 60000);
        })();

        // ========================================
        // CARROUSEL D'IMAGES EN ARRIÈRE-PLAN
        // ========================================
        (function() {
            const carousel = document.getElementById('backgroundCarousel');
            const images = carousel.querySelectorAll('.bg-image');
            let currentIndex = 0;
            const intervalTime = 5000; // Change d'image toutes les 5 secondes

            function changeBackground() {
                // Retirer la classe active de l'image actuelle
                images[currentIndex].classList.remove('active');
                
                // Passer à l'image suivante
                currentIndex = (currentIndex + 1) % images.length;
                
                // Ajouter la classe active à la nouvelle image
                images[currentIndex].classList.add('active');
            }

            // Changer l'image toutes les X secondes
            setInterval(changeBackground, intervalTime);
        })();
    </script>
</body>
</html>

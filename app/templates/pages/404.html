{% extends "layouts/base.html" %}

{% block title %}Page non trouvée{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-content">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Page non trouvée</h2>
        <p class="error-message">
            Désolé, la page que vous recherchez n'existe pas ou a été déplacée.
        </p>
        
        <div class="error-actions">
            <a href="{{ url_for('accueil') }}" class="btn btn-premium btn-primary">Retour à l'accueil</a>
            <a href="javascript:history.back()" class="btn btn-premium btn-secondary">Page précédente</a>
        </div>
    </div>
    
    <div class="error-illustration">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="80" fill="#f0f0f0"/>
            <text x="100" y="120" font-size="80" text-anchor="middle" fill="#666">?</text>
        </svg>
    </div>
</div>
{% endblock %}

{% block styles %}
<style>
    .error-page {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        padding: 2rem;
        gap: 3rem;
    }

    .error-content {
        flex: 1;
        max-width: 500px;
        text-align: center;
    }

    .error-code {
        font-size: 8rem;
        font-weight: 800;
        color: var(--secondary-color);
        line-height: 1;
        margin-bottom: 1rem;
    }

    .error-title {
        font-size: 2rem;
        font-weight: 700;
        color: var(--text-color);
        margin-bottom: 1rem;
    }

    .error-message {
        font-size: 1.1rem;
        color: var(--text-muted-color);
        margin-bottom: 2rem;
        line-height: 1.6;
    }

    .error-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
    }

    .error-illustration {
        flex: 1;
        max-width: 400px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .error-illustration svg {
        width: 100%;
        max-width: 300px;
        height: auto;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .error-page {
            flex-direction: column;
            gap: 2rem;
            padding: 1.5rem;
            min-height: 50vh;
        }

        .error-content {
            max-width: 100%;
        }

        .error-code {
            font-size: 5rem;
        }

        .error-title {
            font-size: 1.5rem;
        }

        .error-message {
            font-size: 1rem;
        }

        .error-actions {
            flex-direction: column;
            width: 100%;
        }

        .error-actions .btn {
            width: 100%;
        }

        .error-illustration {
            max-width: 250px;
        }
    }

    @media (max-width: 480px) {
        .error-page {
            padding: 1rem;
        }

        .error-code {
            font-size: 4rem;
        }

        .error-title {
            font-size: 1.25rem;
        }

        .error-message {
            font-size: 0.95rem;
        }

        .error-illustration {
            max-width: 200px;
        }
    }
</style>
{% endblock %}
